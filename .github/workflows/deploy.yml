name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

# 値はすべて Actions Variables（terraform/bootstrap が書く）。CI は Secrets を持たない。
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SA は refs/heads/main からしかなりすませない（main 以外の workflow_dispatch はここで落ちる）
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"

      - name: Terraform Init (app)
        working-directory: ./terraform/app
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Terraform Apply (app)
        working-directory: ./terraform/app
        run: terraform apply -auto-approve -input=false -var="project_id=${PROJECT_ID}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        # google-github-actions/auth が ADC を用意するので、firebase-tools はトークンなしで動く
        run: |
          npm install -g firebase-tools
          firebase use "${PROJECT_ID}"
          firebase target:apply hosting card "${PROJECT_ID}-card"
          firebase deploy --only hosting:card --project "${PROJECT_ID}" --non-interactive
